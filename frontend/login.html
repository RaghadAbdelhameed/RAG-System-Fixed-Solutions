<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - KnowledgeHub</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="shell" style="max-width:420px; margin-top:60px;">
    <div class="card">
      <h1>KnowledgeHub</h1>
      <p class="hint">Multi-organization knowledge assistant platform</p>
      <label>Email</label>
      <input type="email" id="email">
      <label>Password</label>
      <input type="password" id="password">
      <div id="err" class="error-text"></div>
      <button class="primary" onclick="doLogin()">Sign in</button>
    </div>
  </div>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
<script>
  document.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
