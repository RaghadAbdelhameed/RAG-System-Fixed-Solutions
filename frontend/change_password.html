<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password - KnowledgeHub</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <div class="shell" style="max-width:420px; margin-top:60px;">
    <div class="card">
      <h1>Change password</h1>
      <p class="hint">This is required the first time you sign in with a temporary password.</p>
      <label>Current (temporary) password</label>
      <input type="password" id="current">
      <label>New password</label>
      <input type="password" id="new1">
      <label>Confirm new password</label>
      <input type="password" id="new2">
      <div id="err" class="error-text"></div>
      <button class="primary" onclick="submitChange()">Save</button>
    </div>
  </div>
<script src="js/api.js"></script>
<script>
requireLogin();
async function submitChange() {
  const current_password = document.getElementById("current").value;
  const p1 = document.getElementById("new1").value;
  const p2 = document.getElementById("new2").value;
  const err = document.getElementById("err");
  err.textContent = "";
  if (p1 !== p2) { err.textContent = "The new passwords do not match."; return; }
  try {
    await apiSend("/auth/change-password", "POST", { current_password, new_password: p1 });
    const role = localStorage.getItem("kh_role");
    if (role === "super_admin") window.location.href = "superadmin.html";
    else if (role === "org_admin") window.location.href = "admin.html";
    else window.location.href = "chat.html";
  } catch (e) {
    err.textContent = typeof e.detail === "string" ? e.detail : "Could not change the password.";
  }
}
</script>
</body>
</html>
